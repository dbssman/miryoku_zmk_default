# Battery-focused settings for the Corne (central/left half).
# Keep this in sync with corne_right.conf.

# nice_nano is the bare hardware board; these are the ZMK board settings
# that the nice_nano//zmk variant would normally provide.
CONFIG_ZMK_BLE=y
CONFIG_ZMK_USB=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y

# No nice!view or other display in this build.
CONFIG_ZMK_DISPLAY=n

# Mouse keys / pointer support.
CONFIG_ZMK_POINTING=y

# Enter idle after 30 seconds.
CONFIG_ZMK_IDLE_TIMEOUT=30000

# Deep sleep after 15 minutes of inactivity. The Corne kscan has
# wakeup-source, so a key press wakes the half it is pressed on.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
