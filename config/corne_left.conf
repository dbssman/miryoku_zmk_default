# Battery-focused settings for the Corne (central/left half).
# Keep the shared settings in sync with corne_right.conf; the split
# battery and ZMK Studio settings below are central-only.

# The nice_nano//zmk variant supplies these; kept explicit so local
# builds and the generated matrix.txt record the full configuration.
CONFIG_ZMK_BLE=y
CONFIG_ZMK_USB=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y

# No nice!view or other display in this build.
CONFIG_ZMK_DISPLAY=n

# Mouse keys / pointer support.
CONFIG_ZMK_POINTING=y

# Fetch the right half's battery level over the split link and expose it
# to the host as a second Battery Level service. Required by tools such
# as zmk-battery-center to show both halves.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Runtime keymap editing over BLE with ZMK Studio (central only).
# Locking is disabled so no &studio_unlock key is needed on the Miryoku
# layout; the connection is already protected by BLE pairing.
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# Enter idle after 30 seconds.
CONFIG_ZMK_IDLE_TIMEOUT=30000

# Deep sleep after 15 minutes of inactivity. The Corne kscan has
# wakeup-source, so a key press wakes the half it is pressed on.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
